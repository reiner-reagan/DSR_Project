<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d0d9e3">
  <title>DS+R — Architecture and Design</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" aria-label="DS+R">
      <img class="hero__image" src="images/highline-hero.jpg" alt="">
      <div class="hero__mark">
        <img src="images/dsr-mark.png" alt="DS+R">
      </div>
    </section>

    <section class="categories" aria-labelledby="categories-title">
      <h1 class="section-title" id="categories-title">CATEGORIES</h1>
      <div class="category-grid" id="category-grid">
        <article class="category-card">
          <h2>CULTURAL</h2>
          <img src="images/highline-hero.jpg" alt="The High Line elevated public park">
        </article>
        <article class="category-card">
          <h2>PUBLIC SPACE</h2>
          <img src="images/shed.jpg" alt="The Shed cultural center">
        </article>
        <article class="category-card">
          <h2>EDUCATION</h2>
          <img src="images/moma.jpg" alt="Museum gallery interior">
        </article>
        <article class="category-card">
          <h2>RESIDENTIAL</h2>
          <img src="images/residential.jpg" alt="Residential architecture at sunset">
        </article>
        <article class="category-card">
          <h2>COMMERCIAL</h2>
          <img src="images/commercial.jpg" alt="The Broad contemporary art museum">
        </article>
      </div>
      <button class="carousel-control carousel-control--previous" type="button" aria-label="Previous categories">
        <img src="images/carousel-arrow.png" alt="">
      </button>
      <button class="carousel-control carousel-control--next" type="button" aria-label="Next categories">
        <img src="images/carousel-arrow.png" alt="">
      </button>
    </section>

    <nav class="site-links" aria-label="Explore DS+R">
      <a class="site-link" href="#studio">
        <span>STUDIO</span>
        <img src="images/studio.png" alt="">
      </a>
      <a class="site-link" href="#news">
        <span>NEWS</span>
        <img src="images/news.png" alt="">
      </a>
      <a class="site-link" href="#meet-us">
        <span>MEET US</span>
        <img src="images/meet-us.jpg" alt="">
      </a>
      <a class="site-link" href="#contact">
        <span>CONTACT</span>
        <img src="images/contact.png" alt="">
      </a>
    </nav>
  </main>
</body>
</html>
