<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Culture — DS+R</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/culture.css">
</head>
<body>
  <main>
    <header class="culture-hero">
      <img class="culture-hero__background" src="images/culture-header.png" alt="">
      <a class="culture-hero__logo" href="index.html" aria-label="DS+R home">
        <img src="images/dsr-mark.png" alt="DS+R">
      </a>
      <h1>CULTURE</h1>
      <a class="culture-hero__home" href="index.html" aria-label="Back to home">
        <img src="images/home-icon.svg" alt="">
      </a>
    </header>

    <section class="culture-projects" aria-label="Cultural projects">
      <div class="culture-project-grid">
        <article class="culture-project-card culture-project-card--shed">
          <h2>THE SHED</h2>
          <div class="culture-project-card__image">
            <img src="images/culture-shed.png" alt="The Shed cultural center">
          </div>
        </article>
        <article class="culture-project-card culture-project-card--broad">
          <h2>THE BROAD</h2>
          <div class="culture-project-card__image">
            <img src="images/culture-broad.jpg" alt="The Broad museum">
          </div>
        </article>
        <article class="culture-project-card culture-project-card--unm">
          <h2>UNM CCAT</h2>
          <div class="culture-project-card__image">
            <img src="images/culture-unm.jpg" alt="UNM Center for Collaborative Arts and Technology">
          </div>
        </article>
        <article class="culture-project-card culture-project-card--pina">
          <h2>PINA BAUSCH</h2>
          <div class="culture-project-card__image">
            <img src="images/culture-pina.jpg" alt="Pina Bausch theater">
          </div>
        </article>
        <article class="culture-project-card culture-project-card--bampfa">
          <h2>BAMPFA</h2>
          <div class="culture-project-card__image">
            <img src="images/culture-bampfa.jpg" alt="Berkeley Art Museum and Pacific Film Archive">
          </div>
        </article>
        <article class="culture-project-card culture-project-card--eyebeam">
          <h2>EYEBEAM</h2>
          <div class="culture-project-card__image">
            <img src="images/culture-eyebeam.jpg" alt="Eyebeam arts and technology center">
          </div>
        </article>
        <article class="culture-project-card culture-project-card--moma">
          <h2>MOMA</h2>
          <div class="culture-project-card__image">
            <img src="images/culture-moma.jpg" alt="Museum of Modern Art">
          </div>
        </article>
        <article class="culture-project-card culture-project-card--sarofim">
          <h2>SAROFIM HALL</h2>
          <div class="culture-project-card__image">
            <img src="images/culture-sarofim-hall.jpg" alt="Sarofim Hall at Rice University">
          </div>
        </article>
      </div>
      <p class="culture-projects__pagination" aria-label="Page 1 of 10">&lt; 1 of 10 &gt;</p>
    </section>
  </main>
</body>
</html>
